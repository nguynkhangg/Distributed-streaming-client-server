<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CollabNet</title>
</head>
<body>
  <!--
    index.html — KHUNG TRANG thuần HTML, không có CSS (chỉ có cấu trúc, không có dữ liệu hay logic):
    màn hình đăng nhập và màn hình chính (danh sách online, khung chat, trạng thái mạng, tiến độ
    truyền file). Dữ liệu do app.js điền vào từ các sự kiện của agent (xem api.js).
  -->
  <div id="banner" role="status" hidden></div>
  <div id="toasts" aria-live="assertive"></div>

  <div id="login-view">
    <h1>CollabNet</h1>
    <form id="login-form" autocomplete="off">
      <p><label>Username: <input id="login-user" required maxlength="32" autofocus></label></p>
      <p><label>Password: <input id="login-pass" type="password" required></label></p>
      <p id="login-error" role="alert" hidden></p>
      <p><button id="login-btn" type="submit">Log in</button></p>
    </form>
  </div>

  <div id="app-view" hidden>
    <h1>CollabNet</h1>
    <p>Logged in as <b id="self-name"></b> <button id="logout-btn" type="button">Log out</button></p>
    <hr>

    <h2>Chats</h2>
    <ul id="channel-list"></ul>
    <h3>Online users</h3>
    <ul id="user-list"></ul>
    <hr>

    <h2 id="conv-title"></h2>
    <p id="pill-conn"></p>
    <div id="messages" aria-live="polite"></div>
    <form id="composer" autocomplete="off">
      <button id="attach-btn" type="button">Attach file</button>
      <input id="text-input" maxlength="250" size="50" aria-label="Message">
      <button id="send-btn" type="submit">Send</button>
    </form>
    <hr>

    <h2>File transfers</h2>
    <ul id="transfer-list"></ul>
  </div>

  <script src="api.js"></script>
  <script src="app.js"></script>
</body>
</html>
